<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快捷搜索</title>
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <main class="search-shell">
    <header class="search-header">
      <div class="search-brand"><i>☯</i><span><b id="windowTitle">快捷搜索</b><small>快捷宠</small></span></div>
      <div class="mode-switch" role="tablist" aria-label="窗口模式">
        <button class="active" data-mode="search" role="tab">⌕ <span>搜索</span></button>
        <button data-mode="launcher" role="tab">▦ <span>启动台</span></button>
      </div>
    </header>
    <label id="searchInputWrap" class="search-input-wrap"><span>⌕</span><input id="globalSearchInput" autocomplete="off" placeholder="搜索名称、标签、路径或命令"></label>
    <div class="search-meta"><span id="searchHint">全部快捷项目</span><b id="shortcutHint"></b></div>
    <section id="globalSearchResults" class="search-results"></section>
  </main>
  <script src="search.js"></script>
</body>
</html>
